# You vs You — production deploy on Hostinger VPS.
# Joins the same shared Traefik network (`n8n_default`) as n8n and meeting-app.

services:
  youvsyou:
    build: .
    container_name: youvsyou
    restart: always
    env_file:
      - .env
    environment:
      # Force SQLite onto the bind-mounted volume so data survives rebuilds.
      DATABASE_URL: "file:./data/youvsyou.db"
    volumes:
      - ./data:/app/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.youvsyou.rule=Host(`youvsyou.laicosmedia.de`)
      - traefik.http.routers.youvsyou.tls=true
      - traefik.http.routers.youvsyou.entrypoints=web,websecure
      - traefik.http.routers.youvsyou.tls.certresolver=mytlschallenge
      - traefik.http.services.youvsyou.loadbalancer.server.port=3000

networks:
  # Shared with n8n + meeting-app so Traefik can route to all of them.
  default:
    name: n8n_default
    external: true
